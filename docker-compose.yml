services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qrify
      POSTGRES_PASSWORD: qrify_dev_password
      POSTGRES_DB: qrify
    ports:
      - "5432:5432"
    volumes:
      - qrify_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrify"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qrify_postgres_data:
